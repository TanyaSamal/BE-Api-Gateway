version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nest_rabbitmq
    ports:
      - "5672:5672"     # Порт для подключения NestJS (AMQP-протокол)
      - "15672:15672"   # Порт для веб-панели управления (Management Plugin)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  rabbitmq_data:
