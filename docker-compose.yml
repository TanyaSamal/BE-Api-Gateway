version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nest_rabbitmq
    ports:
      - "5672:5672"     # Порт для подключения NestJS (AMQP-протокол)
      - "15672:15672"   # Порт для веб-панели управления (Management Plugin)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
  redis:
    image: redis:7-alpine
    container_name: nest_redis
    ports:
      - "6379:6379"
    restart: always
  prometheus:
    image: prom/prometheus:latest
    container_name: nestjs_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: nestjs_grafana
    ports:
      - "3010:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль для первого входа в веб-панель - new - tanya
    depends_on:
      - prometheus

volumes:
  rabbitmq_data:
